<html lang="es" class="scroll-smooth">
  <head>

    <link rel="canonical" href="https://parismagicplan.com/" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:description"
      content="Planificamos contigo cada detalle de tu viaje a Disneyland Paris: alojamiento, entradas, planes de comidas, vuelos, traslados, restaurantes y espectáculos."

    <!-- Google Fonts: Cormorant Garamond (Display) & Plus Jakarta Sans (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TravelAgency",
        "name": "Paris Magic Plan",
        "description": "Planificamos contigo cada detalle de tu viaje a Disneyland Paris: alojamiento, entradas, planes de comidas, vuelos, traslados, restaurantes, experiencias con personajes, espectáculos y la organización de tus días en los parques.",
        "areaServed": "ES",
        "availableLanguage": ["Spanish"],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Travel Planner personalizado",
            "description": "Por 200 € planificamos y organizamos tu viaje al completo, adaptándolo a tu familia, tus días, tus prioridades y tu presupuesto.",
            "price": "200",
            "priceCurrency": "EUR"
          },
          {
            "@type": "Offer",
            "name": "Seguro de viaje opcional",
            "description": "Desde 25 € por persona, con coberturas como asistencia médica, cancelación en los supuestos contemplados en la póliza, equipaje y asistencia 24 horas en español.",
            "price": "25",
            "priceCurrency": "EUR"
          }
        ]
      }
    </script>
